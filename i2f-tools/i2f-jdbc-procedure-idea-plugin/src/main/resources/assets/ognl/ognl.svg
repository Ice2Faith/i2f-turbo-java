    </defs>


    <text x="4" y="14" font-size="3.8" fill="url(#leftLineGradient)" font-family="sans-serif">Ognl</text>

    <text x="4.6" y="6.6" font-size="5" fill="url(#rightGradient)" font-family="sans-serif">o</text>

    <text x="1" y="11" font-size="12" fill="url(#leftLineGradient)" font-family="sans-serif">G</text>
    <text x="11" y="8.8" font-size="6" fill="url(#rightGradient)" font-family="sans-serif">n</text>

    <text x="9.6" y="10" font-size="8.8" fill="url(#leftLineGradient)" font-family="sans-serif">L</text>

