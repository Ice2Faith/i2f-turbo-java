spring:
  profiles:
    active: dev

xproc4j:
  xml-locations: classpath*:procedure/**/*.xml;classpath*:com/**/procedure/*.xml
  watching-directories: classpath*:procedure/;classpath*:com/


# ops-starter 工具开关（前缀 ai.tools；ai-starter 的 mcp-gateway / groovy-dynamic-tools 在下方 i2f.springboot.ai.tools 中）
ai:
  tools:
    file:
      root-path: ./ai-root
      allow-change-full-access: false
      full-access: false
    webjs:
      enable: true
    selenium-web-search:
      enable: false
    playwright-web-search:
      enable: false
    database:
      update:
        enable: false
    command:
      enable: false
    powershell:
      enable: false
    robot:
      enable: false
    pandoc:
      enable: false
    form:
      enable: false
    groovy:
      enable: false
    python:
      enable: false
    nodejs:
      enable: false
    dashscope-t2i:
      enable: false
    kling-t2i:
      enable: false
    vidu-t2i:
      enable: false
    happyhorse-t2v:
      enable: false
    kling-t2v:
      enable: false
    pixverse-t2v:
      enable: false
    vidu-t2v:
      enable: false
    qwen_tts:
      enable: true
  # ops-starter: Qwen TTS（前缀 ai.tts.qwen）
  tts:
    qwen:
      enable: false
      url: wss://llm-xxxx.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference
      api-key: sk-xxxx
      model: qwen-audio-3.0-tts-flash
      voice: longanhuan_v3.6

# ops 操作面板
i2f:
  springboot:
    ops:
      open-ai:
        enable: true
      dashscope:
        enable: true
      secure:
    #         cert:

    ai:
      # ai-starter: 容器工具网关与 groovy 动态工具（前缀 i2f.springboot.ai.tools）
      tools:
        mcp-gateway:
          enable: true
        groovy-dynamic-tools:
          enable: false
      # ai-starter: RAG 总开关与嵌入模型（前缀 i2f.springboot.ai.rags）
      rags:
        enable: false
        embedding:
          base-url: http://localhost:11434/v1
          api-key: xxx
          model: qwen3-embedding:0.6b
          dimension: 1024
          enable-load-docs: false
          docs-path: ./rags
          max-segment-size-in-chars: 512
          docs-embed-batch-size: 10
          max-overlap-rate: 0.15
        reader:
          markitdown:
            enable: true
          easycor:
            enable: true
          pdf-easycor:
            enable: true
          pandoc:
            enable: true
      mcp:
        server:
          # expose tools as mcp tools
          provider:
            enable: true
            manager:
              enable: false
            default-expose: true
            rules:
              - pattern: "**.webjs_*"
                expose: false
              - exclude-tags:
                  - high_cost
                expose: false
          # simple mcp server implements privacy protocol mcp (with hmac signature verify)
          simple:
            enable: false
            # disable to skip creating HttpSimpleMcpServer bean itself
            server:
              enable: true
            expire-window-minutes: 30
            hmac-name: HmacSHA256
            app-list:
              - app-id: xxx
                app-key: xxx
            # springweb transport (based on RestController, enabled by default)
            springweb:
              enable: false
            # netty transport (standalone port, disabled by default)
            netty:
              enable: false
              port: 23745
              boss-thread: 4
              worker-thread: 0
              max-content-length: 65536
              handler:
                enable: true
              server:
                enable: true
          # official mcp server
          official:
            # for 2024 stateful version
            v2024:
              # stream mcp server implements official protocol mcp (streamable http, json-rpc 2.0 only)
              stream:
                server-name: i2f-mcp-server
                server-version: 1.0.0
                # springweb transport (based on RestController, enabled by default)
                springweb:
                  enable: false
                bearer-token:
                  enable: true
                  allow-tokens:
                    - ik-123456
            # for 2026 stateless version (no initialize handshake, tools/list + tools/call only)
            v2026:
              # stream mcp server implements official 2026-07-28 stateless protocol (streamable http, json-rpc 2.0 only)
              stream:
                server-name: i2f-mcp-server
                server-version: 1.0.0
                # optional natural-language guidance for LLMs returned by server/discover
                instructions: This server provides tool utilities.
                # springweb transport (based on RestController, enabled by default)
                springweb:
                  enable: false
                bearer-token:
                  enable: true
                  allow-tokens:
                    - ik-123456
                # tools/list cache semantics (CacheableResult)
                tool-list:
                  ttl-ms: 300000
                  cache-scope: private