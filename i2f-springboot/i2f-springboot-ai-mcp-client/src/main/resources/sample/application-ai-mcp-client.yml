i2f:
  springboot:
    ai:
      mcp:
        client:
          # simple mcp client implements privacy protocol mcp
          simple:
            enable: true
            instances:
              - enable: false
                name: demo
                description: a group utils tool
                base-url: http://localhost:8811/
                app-id: xxx
                app-key: xxx
                hmac-name: HmacSHA256
          # official mcp client
          official:
            # for 2024 stateful version
            v2024:
              # stream mcp client implements official protocol mcp (streamable channel only)
              stream:
                enable: true
                instances:
                  - enable: false
                    name: demo
                    description: a group utils tool
                    url: http://localhost:9999/mcp
                    bearer-token: xxx
                    #tag-rules:
                    #  - pattern: "*web*"
                    #    tags: ["auto","readonly"]
                    #headers:
                    #  key: value
              # solon mcp client implements official protocol mcp
              solon:
                enable: true
                instances:
                  - enable: false
                    name: demo
                    description: a group utils tool
                    url: http://localhost:9999/mcp
                    channel: streamable
                    bearer-token: xxx
                    #tag-rules:
                    #  - pattern: "*web*"
                    #    tags: ["auto","readonly"]
                    #headers:
                    #  key: value
            # for 2026 stateless version (no initialize handshake, tools/list + tools/call only)
            v2026:
              # stream mcp client implements official protocol mcp (streamable channel only)
              stream:
                enable: true
                instances:
                  - enable: false
                    name: demo
                    description: a group utils tool
                    url: http://localhost:9999/mcp
                    bearer-token: xxx
                    #tag-rules:
                    #  - pattern: "*web*"
                    #    tags: ["auto","readonly"]
                    #headers:
                    #  key: value