<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配核心：控制视口宽度和缩放比例 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1小时缓存过期 -->
    <meta http-equiv="Cache-Control" content="max-age=3600, public">
    <title>Ops - QrCode</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../lib/vue/vue-2.js"></script>
    <script src="../common/js/IpUtils.js"></script>
    <script src="../lib/moment/moment-2.24.0.js"></script>
    <script src="../lib/element-ui/element-ui-2.15.10.js"></script>
    <link rel="stylesheet" href="../lib/element-ui/element-ui-2.15.10.css"/>
    <link rel="stylesheet" href="../lib/element-ui/element-ui-2.15.10-icon.css"/>
    <link href="../lib/element-ui/fonts/element-icons.ttf"/>
    <link href="../lib/element-ui/fonts/element-icons.woff"/>
    <script src="../lib/axios/axios-1.1.3.min.js"></script>
    <script src="../lib/axios/qs.js"></script>
    <script src="../lib/sm-crypto-0.3.2.1-RELEASE/sm4.js"></script>
    <script src="../lib/sm-crypto-0.3.2.1-RELEASE/sm3.js"></script>
    <script src="../lib/sm-crypto-0.3.2.1-RELEASE/sm2.js"></script>
    <script src="../lib/base64/Base64.js"></script>
    <script src="../common/OpsSecureKeyPair.js"></script>
    <script src="../common/OpsSecureCertPair.js"></script>
    <script src="../common/OpsSecureDto.js"></script>
    <script src="../common/OpsSecureHelper.js"></script>
    <script src="../common/OpsSecureTransfer.js"></script>
    <script src="../lib/vue-contextmenujs-1.4.11/contextmenu.umd.js"></script>

    <script src="../lib/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../lib/jsqr@1.4.0/dist/jsQR.js"></script>

</head>
<body>
<div id="app">
    <el-divider>QrCode操作</el-divider>
    <el-row type="flex" justify="center">
        <el-switch
                v-model="form.mode"
                active-color="#13ce66"
                inactive-color="#409EFF"
                active-text="识别"
                inactive-text="生成">
        </el-switch>
    </el-row>
    <el-card v-show="form.mode==false" shadow="never">
        <el-form label-width="80px" label-position="top">
            <el-form-item label="文本">
                <el-input type="textarea"
                          clearable
                          v-model="form.content"
                          :rows="5"/>
            </el-form-item>
            <el-form-item label="二维码">
                <div ref="resultQrcode"></div>
            </el-form-item>
        </el-form>
        <el-row type="flex" justify="center">
            <el-button size="small" type="primary" @click="onGenerateQrCode">生成二维码</el-button>
        </el-row>
    </el-card>
    <el-card v-show="form.mode==true" shadow="never">
        <el-form label-width="80px" label-position="top">
            <el-form-item label="二维码">
                <el-upload
                        ref="upload"
                        action="#"
                        drag
                        list-type="picture-card"
                        :file-list="form.fileList"
                        :on-change="onFileChange"
                        :auto-upload="false">
                    <i class="el-icon-plus"></i>
                </el-upload>
            </el-form-item>
            <el-form-item label="结果">
                <el-input type="textarea"
                          clearable
                          v-model="form.result"
                          :rows="5"/>
            </el-form-item>
        </el-form>
        <el-row type="flex" justify="center">
            <el-button size="small" type="success" @click="onGenerateQrCode">识别二维码</el-button>
        </el-row>
    </el-card>

</div>
</body>
<script>
    window.app = new Vue({
        components: {},
        data() {
            return this.getDefaultData()
        },
        created() {
            this.initStoreData();
            this.initBroadcast();
        },
        mounted() {

        },
        watch: {},
        computed: {},
        methods: {
            getDefaultData() {
                return {
                    langEditors: {

                    },
                    completions: [],
                    storage: {},
                    metas: {
                        cert: '',
                    },
                    drawer: {},
                    dialog: {

                    },
                    form: {
                        mode: false,
                        content: '',
                        fileList: [],
                        result: ''
                    }
                }
            },
            initBroadcast() {
                this.opsBroadcastChannel = new BroadcastChannel('ops_station_broadcast');

                setInterval(() => {
                    this.opsBroadcastChannel.postMessage({
                        type: 'cert',
                        data: this.metas.cert
                    });
                }, 3000)


                this.opsBroadcastChannel.onmessage = (event) => {
                    let data = event.data;
                    if (data.type == 'cert') {
                        if (!this.metas.cert || this.metas.cert == '') {
                            this.metas.cert = data.data;
                        }
                    }
                };

            },
            loadData() {
                let content = localStorage.getItem('ops:qrcode:data');
                if (!content) {
                    return
                }
                content = content.trim();
                if (content.length == 0) {
                    return;
                }
                try {
                    let obj = JSON.parse(content);
                    Object.keys(obj).forEach(k => {
                        this.$data[k] = obj[k];
                    });
                } catch (e) {

                }
            },
            storeData() {
                try {
                    let data = {...this.$data};
                    data.opsBroadcastChannel = null;
                    Object.keys(this.$data.langEditors).forEach(k => {
                        data.langEditors[k] = null;
                    })
                    let json = JSON.stringify(data);
                    let obj = JSON.parse(json);
                    if(!isIntranetPage()) {
                        obj.metas.cert = '';
                    }
                    let content = JSON.stringify(obj);
                    localStorage.setItem('ops:qrcode:data', content);
                } catch (e) {
                    // console.log(e)
                }
            },
            initStoreData() {
                let reset = new URL(window.location.href).searchParams.get('reset');
                if (reset != 'true') {
                    this.loadData();
                }
                setInterval(() => {
                    this.storeData();
                }, 1000);
            },
            doResetData() {
                let newData = this.getDefaultData();
                Object.keys(newData).forEach(k => {
                    this.$data[k] = newData[k];
                })
            },
            onGenerateQrCode(){
                try {
                    let dom = this.$refs.resultQrcode;
                    if (!dom.qrcode) {
                        dom.qrcode = new QRCode(dom, {
                            text: "",
                            width: 200,
                            height: 200,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }

                    dom.qrcode.clear();
                    dom.qrcode.makeCode(this.form.content);
                    this.$message.success('生成成功')
                }catch (e) {
                    console.log(e)
                    this.$message.error('生成失败，或许是内容太长！')
                }
            },
            onFileChange(file,fileList){
                if(!fileList || fileList.length==0){
                    return;
                }
                let currFile=fileList[0]
                this.form.fileList=[currFile]

                let _this=this

                const reader = new FileReader();

                reader.onload=function(e){
                    const img = new Image();

                    img.onload=function(){
                        // 画到 Canvas 上取像素
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0, img.width, img.height);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "dontInvert"
                        });

                        if (code) {
                            _this.form.result = code.data;
                            _this.$message.success('识别成功')
                        } else {
                            _this.form.result = "未识别到二维码，请换一张更清晰的图片";
                            _this.$message.error('识别失败，请检查是否包含二维码或者图片清晰')
                        }
                    }

                    img.onerror=function(){
                        _this.$message.error('识别失败，图片读取失败')
                    }

                    img.src = e.target.result;
                }

                reader.onerror=function(){
                    _this.$message.error('识别失败，文件读取失败')
                }

                reader.readAsDataURL(file.raw);
            }
        }
    })
    let defaultConfig = {
        baseURL: './',
        timeout: 10 * 60 * 1000,
        responseType: 'json'
    }
    let request = axios.create(defaultConfig)
    window.app.$axios = request
    window.app.$mount('#app')
</script>

</html>
